      drawHead(now, (narrow ? 18 : 24) * (1 + energy * .3) * (inside ? 1 : lerp(.7, 1.3, pre)));
      SND.motion(Math.hypot(cam.vx, cam.vy) + speed * .6, inside ? travelAmt > .05 : (pre > .05 && pre < .95), inside ? (curPhase && curPhase.id) : (out > 0 ? 'exit' : 'pre'));
    }
  }
  bgFrame(now); requestAnimationFrame(frame);
}
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = e.pointerType !== 'touch'; pointer.lastMove = performance.now(); }, { passive: true });
addEventListener('pointerleave', () => { pointer.active = false; });
function goto(i) { i = clamp(i, 0, nodes.length - 1); if (calm) { const el = $('#st-' + i); if (el) el.scrollIntoView({ block: 'start' }); return; } const max = $('#scroller').offsetHeight - vh; const preLen = PRE_VH * vh * 1.1, outLen = OUT_VH * vh * 1.1; const n = pts.length - 1; scrollTo({ top: preLen + (i / n) * (max - preLen - outLen) + 1, behavior: 'smooth' }); }
$('#prev').addEventListener('click', () => goto(idx - 1)); $('#next').addEventListener('click', () => goto(idx + 1));
addEventListener('keydown', e => { if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key) && !e.target.matches('button, a, input, textarea')) { e.preventDefault(); goto(idx + 1); } if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key) && !e.target.matches('input, textarea')) { e.preventDefault(); goto(idx - 1); } });
$('#rail').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); goto(+a.getAttribute('href').slice(1)); });
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a || calm) return; const id = a.getAttribute('href').slice(1); let i = nodes.findIndex(n => n.id === id); if (id.startsWith('st-')) i = +id.slice(3); if (i >= 0) { e.preventDefault(); goto(i); } });
document.addEventListener('click', e => { if (e.target.closest('a.cta.accent')) SND.open(); });

// contact form: posts to Formspree in the background, with the plain POST as fallback
document.addEventListener('submit', async e => { const f = e.target; if (!f.matches('#contact-form')) return; e.preventDefault(); const st = f.querySelector('.form-status'), btn = f.querySelector('button'); btn.disabled = true; st.textContent = 'Sending…';
  try { const r = await fetch(f.action, { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(f) }); if (r.ok) { f.reset(); st.textContent = 'Kia ora, received. We will reply by email.'; SND.pop(1.2); } else { st.textContent = 'That did not send. Please email us directly.'; } }
  catch (err) { st.textContent = 'That did not send. Please email us directly.'; } btn.disabled = false; });
$('#pre-enter').addEventListener('click', e => { if (!calm) { e.preventDefault(); goto(0); } });
function layout() { vw = innerWidth; vh = innerHeight; $('#guide').setAttribute('viewBox', `0 0 ${vw} ${vh}`); bgResize(); preResize(); build(); curPhase = null; if (calm) { document.body.classList.remove('dark'); $$('.station').forEach(el => el.classList.add('on')); const ph = phases[0]; bgSet(ph.bg, ph.colour); } }
addEventListener('resize', layout); applyCalm();
const want = location.hash.slice(1); const wi = nodes.findIndex(n => n.id === want); if (wi >= 0) setTimeout(() => goto(wi), 80);
requestAnimationFrame(frame);
})();
</script>
