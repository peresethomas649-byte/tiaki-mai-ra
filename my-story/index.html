<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Story — A Life in Eleven Islands</title>
<meta name="description" content="A scroll-driven cinematic memoir told as eleven drifting islands — a personal journey through the places, people, and craft that have shaped a life." />
<link rel="icon" type="image/png" href="/assets/images/logo.png" />
<link rel="apple-touch-icon" href="/assets/images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ---------- Reset / tokens ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #04070d; color: #eef3ff; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
html { scroll-behavior: auto; }
body { overflow-x: hidden; }

:root {
  /* Glass palette — baked from the final tweak settings.
     Previously these were driven at runtime by a dev tweaks panel;
     the panel has been removed for production and the final values
     are hard-coded here so first paint matches the intended look. */
  --tint-hue: 340;            /* rosé tint hue */
  --tint-sat: 70%;
  --glass-alpha: 0.10;        /* base glass transparency */
  --glass-blur: 6px;          /* backdrop-filter blur */
  --border-alpha: 0.90;       /* thin border luminosity */
  --vignette-strength: 0.45;  /* edge vignette darkness */
  --display-font: "Fraunces", serif;
  --display-italic-style: italic;
  --type-scale: 1;

  --glass-bg-1: hsla(var(--tint-hue), 60%, 70%, calc(var(--glass-alpha) * 0.6));
  --glass-bg-2: hsla(calc(var(--tint-hue) + 10), 55%, 55%, calc(var(--glass-alpha) * 1.0));
  --glass-bg-3: hsla(calc(var(--tint-hue) - 5), var(--tint-sat), 88%, calc(var(--glass-alpha) * 1.4));
  --glass-border: hsla(var(--tint-hue), 90%, 92%, var(--border-alpha));
  --glass-border-strong: hsla(calc(var(--tint-hue) - 5), 95%, 95%, calc(var(--border-alpha) + 0.27));
  --glass-shadow: 0 8px 40px -8px hsla(calc(var(--tint-hue) + 15), 80%, 30%, 0.45),
                  inset 0 1px 0 hsla(0, 0%, 100%, 0.22),
                  inset 0 -1px 0 hsla(var(--tint-hue), 80%, 80%, 0.10);
  --glow: 0 0 0 1px hsla(var(--tint-hue), 100%, 90%, 0.18), 0 8px 36px hsla(var(--tint-hue), 100%, 70%, 0.25);

  --ink: hsla(var(--tint-hue), 30%, 98%, 0.96);
  --ink-dim: hsla(var(--tint-hue), 30%, 92%, 0.72);
  --ink-faint: hsla(var(--tint-hue), 30%, 90%, 0.48);

  --pad: clamp(16px, 2.4vw, 36px);
  --safe-top: max(env(safe-area-inset-top), 0px);
  --safe-bottom: max(env(safe-area-inset-bottom), 0px);
}

/* ---------- Virtual scroll height ---------- */
/* 11 chapters × 110vh of scroll per chapter, plus head + tail breathing room */
#scroll-track {
  height: calc(1320vh + 100vh);
  width: 1px;
  pointer-events: none;
}

/* ---------- Fixed cinematic stage ---------- */
.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, #0a1426 0%, #04070d 70%);
  z-index: 1;
}

.video-wrap {
  position: absolute; inset: 0;
  z-index: 0;
}
.video-wrap video {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  filter: saturate(1.05) contrast(1.02);
}

/* Subtle vignette + readability gradients */
.vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    radial-gradient(140% 90% at 50% 50%, transparent 55%, hsla(220, 60%, 5%, calc(var(--vignette-strength) * 1)) 100%),
    linear-gradient(180deg, hsla(220, 50%, 5%, calc(var(--vignette-strength) * 0.78)) 0%, transparent 18%, transparent 78%, hsla(220, 50%, 5%, var(--vignette-strength)) 100%);
}

/* Soft, drifting color light to give 'spatial' depth even when nothing else is on screen */
.atmos {
  position: absolute; inset: -10%; pointer-events: none; z-index: 1;
  background:
    radial-gradient(40% 30% at 18% 22%, hsla(205, 90%, 75%, 0.12), transparent 60%),
    radial-gradient(50% 35% at 85% 80%, hsla(280, 70%, 70%, 0.10), transparent 65%);
  mix-blend-mode: screen;
  animation: drift 32s ease-in-out infinite alternate;
}
@keyframes drift {
  0%   { transform: translate3d(-1.5%, -1%, 0); }
  100% { transform: translate3d(1.5%, 1.5%, 0); }
}

/* ---------- Liquid glass utility ---------- */
.glass {
  position: relative;
  background:
    linear-gradient(135deg, var(--glass-bg-3) 0%, var(--glass-bg-1) 45%, var(--glass-bg-2) 100%);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  box-shadow: var(--glass-shadow);
  color: var(--ink);
  isolation: isolate;
}
.glass::before {
  /* specular highlight along top edge */
  content: ""; position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, hsla(0,0%,100%,0.18) 0%, hsla(0,0%,100%,0) 22%);
  pointer-events: none;
  mix-blend-mode: screen;
}
.glass::after {
  /* faint inner reflection on bottom */
  content: ""; position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(0deg, hsla(205,100%,85%,0.10) 0%, transparent 28%);
  pointer-events: none;
}

/* ---------- Top navigation ---------- */
.nav {
  position: fixed;
  top: calc(var(--safe-top) + 14px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 999px;
  max-width: calc(100vw - 32px);
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 12px;
  font-family: var(--display-font);
  font-weight: 400;
  font-style: var(--display-italic-style);
  letter-spacing: 0.01em;
  font-size: 14px;
  white-space: nowrap;
  color: var(--ink);
}
.nav-brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #d6e9ff, #6aa6ff 60%, #2c5dd1 100%);
  box-shadow: 0 0 14px hsla(205, 100%, 75%, 0.8);
}
.nav-scroll {
  display: flex; gap: 4px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  max-width: min(70vw, 980px);
  padding: 2px;
  mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
}
.nav-scroll::-webkit-scrollbar { display: none; }

.nav-item {
  flex-shrink: 0;
  appearance: none;
  border: 1px solid hsla(0,0%,100%,0.10);
  background: hsla(210, 60%, 60%, 0.06);
  color: var(--ink-dim);
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  padding: 9px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform .35s cubic-bezier(.2,.7,.2,1), background .35s, color .35s, border-color .35s, box-shadow .35s;
  white-space: nowrap;
  min-height: 36px;
}
.nav-item .idx {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
}
.nav-item:hover {
  transform: translateY(-2px);
  color: var(--ink);
  background: hsla(205, 80%, 70%, 0.14);
  border-color: var(--glass-border-strong);
  box-shadow: 0 8px 24px -8px hsla(205, 100%, 60%, 0.45);
}
.nav-item.active {
  color: #f6fbff;
  background: linear-gradient(135deg, hsla(205, 100%, 78%, 0.28), hsla(225, 90%, 55%, 0.22));
  border-color: hsla(205, 100%, 92%, 0.65);
  box-shadow: 0 0 0 1px hsla(205, 100%, 92%, 0.35) inset,
              0 10px 32px -6px hsla(205, 100%, 60%, 0.55);
}
.nav-item.active .idx { color: hsla(205, 100%, 92%, 0.9); }

/* ---------- Mouse glow ---------- */
.cursor-glow {
  position: fixed;
  width: 360px; height: 360px;
  pointer-events: none;
  z-index: 30;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(205, 100%, 80%, 0.18), hsla(220, 100%, 60%, 0.06) 40%, transparent 70%);
  transform: translate(-50%, -50%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .6s ease;
}

/* ---------- Chapter cards / overlays ---------- */
.overlay-layer {
  position: absolute; inset: 0;
  z-index: 10;
  pointer-events: none;
}
.chapter-frame {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr auto;
  padding: clamp(72px, 9vh, 120px) clamp(20px, 4vw, 64px) clamp(60px, 8vh, 100px);
  gap: 18px;
  opacity: 0;
  transition: opacity .9s ease;
  pointer-events: none;
}
.chapter-frame.visible { opacity: 1; }
.chapter-frame.visible .floats > * { animation: floatIn .9s cubic-bezier(.2,.7,.2,1) both; }
.chapter-frame.visible .floats > *:nth-child(1) { animation-delay: .05s; }
.chapter-frame.visible .floats > *:nth-child(2) { animation-delay: .22s; }
.chapter-frame.visible .floats > *:nth-child(3) { animation-delay: .38s; }
.chapter-frame.visible .floats > *:nth-child(4) { animation-delay: .52s; }

@keyframes floatIn {
  0%   { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(8px); }
  100% { opacity: 1; transform: translateY(0)    scale(1);     filter: blur(0); }
}

/* Floats wrapper has no box of its own (display: contents). Pointer
   events are gated on the per-child elements so only the active
   chapter (.visible) intercepts taps — without this, every chapter
   frame is stacked at inset:0 and the topmost in DOM order (Ch 11)
   silently swallows every click. */
.floats { display: contents; }
.chapter-frame .floats > * { pointer-events: none; }
.chapter-frame.visible .floats > * { pointer-events: auto; }

/* Side-alternation: odd chapters mirror the layout so the eye doesn't
   parse one rhythm. Applied via class so the mobile single-column
   media query can override without fighting inline styles. */
.chapter-frame.side-right .panel-secondary {
  grid-column: 1 / span 1;
  grid-row: 1 / span 1;
  justify-self: start;
  align-self: start;
}
.chapter-frame.side-right .card-primary {
  grid-column: 2 / span 1;
  grid-row: 2 / span 1;
  justify-self: end;
  align-self: end;
}

/* Primary card */
.card-primary {
  grid-column: 1 / span 1;
  grid-row: 2 / span 1;
  align-self: end;
  justify-self: start;
  max-width: min(460px, 42vw);
  padding: 22px 24px 22px;
  border-radius: 26px;
}
.card-primary .num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: hsla(205, 100%, 88%, 0.78);
  display: flex; align-items: center; gap: 10px;
}
.card-primary .num::after {
  content: ""; height: 1px; flex: 1;
  background: linear-gradient(90deg, hsla(205,100%,90%,0.45), transparent);
}
.card-primary .kicker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 14px;
}
.card-primary h2 {
  font-family: var(--display-font);
  font-weight: 400;
  font-size: clamp(28px, 3.4vw, 44px);
  line-height: 1.04;
  letter-spacing: -0.01em;
  margin: 6px 0 8px;
  color: var(--ink);
  text-wrap: balance;
}
.card-primary h2 em {
  font-style: italic;
  color: hsla(205, 100%, 92%, 0.95);
  font-weight: 300;
}
.card-primary .sub {
  font-family: var(--display-font);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(13px, 1.3vw, 15.5px);
  color: var(--ink-dim);
  margin: 0 0 14px;
  text-wrap: balance;
}
.card-primary p.body {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-dim);
  margin: 0 0 16px;
  text-wrap: pretty;
}
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11px;
  letter-spacing: 0.03em;
  padding: 6px 10px;
  border-radius: 999px;
  background: hsla(210, 80%, 80%, 0.10);
  border: 1px solid hsla(205, 90%, 90%, 0.20);
  color: var(--ink);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.actions { margin-top: 18px; display: flex; gap: 10px; }
.btn-glass {
  appearance: none; border: 1px solid hsla(205, 100%, 92%, 0.40);
  background: hsla(205, 100%, 80%, 0.10);
  color: var(--ink);
  font: inherit; font-size: 12.5px; font-weight: 500;
  padding: 9px 14px; border-radius: 999px;
  cursor: pointer; min-height: 38px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .3s, background .3s, box-shadow .3s;
}
.btn-glass:hover { transform: translateY(-2px); background: hsla(205, 100%, 80%, 0.20); box-shadow: 0 10px 28px -8px hsla(205, 100%, 70%, 0.5); }
.btn-glass .arrow { width: 14px; height: 14px; display: inline-block; }

/* Secondary panel — small floating chip card */
.panel-secondary {
  grid-column: 2 / span 1;
  grid-row: 1 / span 1;
  justify-self: end;
  align-self: start;
  max-width: 260px;
  padding: 14px 16px;
  border-radius: 18px;
  font-size: 12px;
  /* Push the voice-memo card down off the chapter nav (desktop). The
     nav floats at the top, and align-self:start otherwise parks this
     card hard against it. Reset to 0 on mobile below. */
  margin-top: clamp(28px, 6vh, 64px);
}
.panel-secondary .label {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 6px;
}
.panel-secondary .quote {
  font-family: var(--display-font);
  font-style: italic; font-weight: 300;
  color: var(--ink); line-height: 1.4;
  font-size: 13.5px;
  text-wrap: balance;
}

/* Coordinate panel — bottom right */
.panel-coord {
  grid-column: 2 / span 1;
  grid-row: 3 / span 1;
  justify-self: end;
  align-self: end;
  padding: 12px 14px;
  border-radius: 14px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  display: flex; flex-direction: column; gap: 4px;
  max-width: 260px;
}
.panel-coord .row { display: flex; justify-content: space-between; gap: 16px; }
.panel-coord .row span:last-child { color: var(--ink); }

/* ---------- Persistent UI: progress + scroll hint ---------- */
.bottom-bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-bottom) + 20px);
  z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px;
  border-radius: 999px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  text-transform: uppercase;
  white-space: nowrap;
}
.dots {
  display: flex; gap: 6px;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: hsla(205, 100%, 92%, 0.25);
  transition: background .4s, transform .4s, box-shadow .4s;
}
.dot.passed { background: hsla(205, 100%, 92%, 0.6); }
.dot.active {
  background: hsla(205, 100%, 95%, 1);
  box-shadow: 0 0 10px hsla(205, 100%, 80%, 0.9);
  transform: scale(1.5);
}
.hint {
  position: fixed; right: 24px; bottom: calc(var(--safe-bottom) + 24px);
  z-index: 40;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  color: var(--ink-faint);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
  opacity: 1;
  transition: opacity .8s ease;
}
.hint.fade { opacity: 0; }
.hint .scroll-icon {
  width: 18px; height: 28px;
  border: 1px solid var(--ink-faint);
  border-radius: 12px;
  position: relative;
}
.hint .scroll-icon::after {
  content: ""; position: absolute; top: 6px; left: 50%;
  width: 2px; height: 6px; background: var(--ink-faint);
  border-radius: 1px; transform: translateX(-50%);
  animation: scrollDrop 1.8s ease-in-out infinite;
}
@keyframes scrollDrop {
  0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
  50%      { transform: translate(-50%, 8px); opacity: 1; }
}

/* Chapter index in top-left corner */
.chapter-index {
  position: fixed;
  top: calc(var(--safe-top) + 18px);
  left: 24px;
  z-index: 40;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex; flex-direction: column; gap: 2px;
}
.chapter-index .big {
  font-family: "Fraunces", serif;
  font-style: italic;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: 0;
  color: var(--ink);
  text-transform: none;
}

/* Intro screen */
.intro-overlay {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  background: radial-gradient(80% 60% at 50% 50%, rgba(8,14,28,0.4), rgba(2,4,8,0.85));
  transition: opacity 1.2s ease;
}
.intro-overlay.hidden { opacity: 0; pointer-events: none; }
.intro-inner { text-align: center; padding: 24px; max-width: 560px; }
.intro-inner .eyebrow {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 22px;
}
.intro-inner h1 {
  font-family: var(--display-font);
  font-weight: 300;
  font-size: clamp(34px, 5vw, 58px);
  margin: 0 0 14px;
  letter-spacing: -0.01em;
  line-height: 1.04;
  text-wrap: balance;
}
.intro-inner h1 em { font-style: italic; color: hsla(205, 100%, 92%, 0.95); }
.intro-inner p {
  font-family: var(--display-font);
  font-style: italic;
  font-weight: 300;
  font-size: 16px;
  color: var(--ink-dim);
  margin: 0 0 28px;
  text-wrap: balance;
  line-height: 1.5;
}
.intro-cta {
  padding: 14px 26px;
  border-radius: 999px;
  font: inherit; font-size: 12.5px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
  border: 1px solid var(--glass-border-strong);
  background: hsla(205, 100%, 80%, 0.10);
  transition: all .3s ease;
}
.intro-cta:hover { background: hsla(205, 100%, 80%, 0.22); transform: translateY(-2px); }

.intro-loading {
  margin-top: 18px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px; letter-spacing: 0.22em; color: var(--ink-faint);
  text-transform: uppercase;
}

/* ---------- Card collapse/expand (mobile)  ----------
   The `.card-extra` wraps the tags + optional "View artefacts" CTA.
   On desktop it's always visible. On mobile it collapses behind a
   max-height + opacity transition until the user taps the card.
   The `.card-tap-hint` is mobile-only — a small chevron with
   "Tap for more", which fades out once the card is expanded. */
.card-extra { display: block; }
.card-tap-hint { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .nav-brand { display: none; }
}
@media (max-width: 900px) {
  .chapter-frame {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto auto;
    /* Tighter vertical chrome on mobile: the primary card sits in
       grid-row 3 with align-self:end, so a smaller bottom padding
       pulls it down to just above the bottom progress pill instead
       of floating in the middle of the viewport. */
    padding: clamp(60px, 9vh, 90px) 16px 78px;
    gap: 10px;
  }
  /* Defeat the desktop side-alternation rules on mobile: every chapter
     gets the same stacked column-1 layout (secondary on top, primary on
     bottom) regardless of which side it lives on at desktop sizes. */
  .chapter-frame.side-left .panel-secondary,
  .chapter-frame.side-right .panel-secondary,
  .panel-secondary {
    grid-column: 1; grid-row: 1;
    justify-self: start;
    align-self: start;
    max-width: calc(100vw - 32px);
    margin-top: 0; /* desktop-only nudge reset on mobile */
  }
  .chapter-frame.side-left .card-primary,
  .chapter-frame.side-right .card-primary,
  .card-primary {
    grid-column: 1; grid-row: 3;
    justify-self: start;
    align-self: end;
    max-width: 100%;
    padding: 18px 20px;
    border-radius: 22px;
  }
  .card-primary h2 { font-size: clamp(24px, 5.5vw, 32px); }
  .card-primary p.body { font-size: 13px; }

  /* Voice-memo card: drop the "VOICE MEMO · 0:14" header and let the
     italic quote be the entire card. We also bound width so it stays
     horizontal-feeling instead of getting squashed by the grid. */
  .panel-secondary .label { display: none; }
  .panel-secondary {
    padding: 11px 14px;
    width: auto;
  }
  .panel-secondary .quote {
    font-size: 13px;
    line-height: 1.4;
  }

  .panel-coord { display: none; }
  .nav-scroll { max-width: 65vw; }

let videoReady = false;
let scrollMax = 1;
let targetTime = 0;
let currentTime = 0;
let lastScrollY = 0;
let userInteracted = false;
let smoothScrollTween = null;

  scrollMax = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);

    return;
  }

  const dur = video.duration || 1;
  const pct = Math.min(100, Math.round((end / dur) * 100));
  loadingPct.textContent = pct + '%';

   journey: swipe LEFT→RIGHT plays forward, RIGHT→LEFT plays backward.
   We translate the horizontal finger delta into a window scroll
   position (which the existing onScroll → targetTime mapping picks up),
   so horizontal and vertical input stay in perfect sync. Only
   predominantly-horizontal gestures are captured; vertical swipes fall
   through to native scrolling untouched. */
(function attachHorizontalSwipe() {
  let startX = 0, startY = 0, startScrollY = 0;
  let horizontal = false, tracking = false;
  const SENSITIVITY = 2.4; // px of scroll per px of horizontal swipe

  window.addEventListener('touchstart', (e) => {
    if (!videoReady || e.touches.length !== 1) { tracking = false; return; }
    tracking = true;
    horizontal = false;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startScrollY = window.scrollY;
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (!tracking || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // Lock into horizontal mode once the gesture is clearly sideways.
    if (!horizontal && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      horizontal = true;
    }
    if (horizontal) {
      // Prevent the browser from also panning vertically.
      if (e.cancelable) e.preventDefault();
      // L→R (dx > 0) advances; R→L rewinds.
      const targetY = startScrollY + dx * SENSITIVITY;
      window.scrollTo(0, Math.max(0, Math.min(scrollMax, targetY)));
    }
  }, { passive: false });

  window.addEventListener('touchend', () => { tracking = false; horizontal = false; }, { passive: true });
  window.addEventListener('touchcancel', () => { tracking = false; horizontal = false; }, { passive: true });
})();

const SCROLL_SMOOTHING = 0.28;
// Duration (ms) of programmatic scrubs when a nav chip is clicked.
const NAV_SCRUB_DURATION_MS = 3000;

// ----- Seek throttling -----
// Setting video.currentTime up to 60×/sec floods the decoder: each seek
// must decode from the nearest keyframe to the target, and if a seek
// can't finish within a frame the requests queue up and the video lags
// (very visible on desktop where f_auto served a large file). Instead we
// only issue the NEXT seek once the previous one's `seeked` event fires,
// so we never outrun the decoder. A short fallback timer releases the
// lock if `seeked` doesn't fire (e.g. a no-op seek to the same time).
let isSeeking = false;
let seekFallbackTimer = null;
video.addEventListener('seeked', () => {
  isSeeking = false;
  if (seekFallbackTimer) { clearTimeout(seekFallbackTimer); seekFallbackTimer = null; }
});
function requestSeek(t) {
  if (isSeeking) return;
  isSeeking = true;
  try { video.currentTime = t; }
  catch (e) { isSeeking = false; return; }
  clearTimeout(seekFallbackTimer);
  seekFallbackTimer = setTimeout(() => { isSeeking = false; }, 180);
}

function update(force = false) {
  // Smooth video time approach (avoids stutter from many rapid setCurrentTime calls)
  const diff = targetTime - currentTime;
  const smooth = SCROLL_SMOOTHING;
  if (Math.abs(diff) > 0.01 || force) {
    currentTime += diff * smooth; // ease
    if (videoReady) requestSeek(currentTime); // throttled to decoder pace
  }

  // Derive active chapter from progress
  const p = videoDuration ? currentTime / videoDuration : 0;
  const idxFloat = p * CHAPTER_COUNT;
  const activeIdx = Math.min(CHAPTER_COUNT - 1, Math.max(0, Math.floor(idxFloat)));

  // Position within chapter (0..1)
  const local = idxFloat - activeIdx;

  // Visibility envelope: fade in mid-chapter, fade out near the end.
  // Each chapter has an optional `delaySec` (see CHAPTERS) which shifts
  // the fade-in window later within its scroll slot, so the overlay
  // text doesn't appear before its matching island reaches centre frame.
  const chapterSlotSec = videoDuration && CHAPTER_COUNT
    ? videoDuration / CHAPTER_COUNT
    : 1;
  frames.forEach((f, i) => {
    let vis = 0;
    if (i === activeIdx) {
      const ch = CHAPTERS[i];
      const delayLocal = Math.min(0.7, (ch.delaySec || 0) / chapterSlotSec);
      if (local < delayLocal) {
        vis = 0;
      } else {
        // Re-normalise position over the post-delay portion of the slot.
        const eff = (local - delayLocal) / Math.max(0.001, 1 - delayLocal);
        if (eff < 0.12) vis = eff / 0.12;
        else if (eff > 0.82) vis = Math.max(0, (1 - eff) / 0.18);
        else vis = 1;
      }
    }
    f.style.opacity = vis.toFixed(3);
    if (vis > 0.05) f.classList.add('visible'); else f.classList.remove('visible');
  });

  // Nav active state
  [...navScroll.children].forEach((btn, i) => {
    btn.classList.toggle('active', i === activeIdx);
  });

  // Dots
  [...dotsEl.children].forEach((d, i) => {
    d.classList.toggle('active', i === activeIdx);
    d.classList.toggle('passed', i < activeIdx);
  });

  // Chapter index display
  const ch = CHAPTERS[activeIdx];
  ciNum.textContent = `${String(activeIdx + 1).padStart(2, '0')} / ${String(CHAPTER_COUNT).padStart(2, '0')}`;
  ciLabel.textContent = ch.short;
  bbLabel.textContent = ch.label;

  // Handle activeIdx change: collapse the previously-active card so each
  // chapter opens fresh, and pull the nav strip so the active chip stays
  // in view on mobile.
  if (activeIdx !== lastActiveIdx) {
    if (lastActiveIdx >= 0) {
      const prevCard = frames[lastActiveIdx] && frames[lastActiveIdx].querySelector('.card-primary');
      if (prevCard && prevCard.classList.contains('expanded')) {
        prevCard.classList.remove('expanded');
        prevCard.setAttribute('aria-expanded', 'false');
      }
    }
    autoScrollNavToActive(activeIdx);
    lastActiveIdx = activeIdx;
  }

  requestAnimationFrame(() => update(false));
}
let lastActiveIdx = -1;
requestAnimationFrame(() => update(false));

/* ============================================================
   Smooth scroll to chapter (nav click)
   ============================================================ */
function smoothScrollToChapter(idx) {
  if (!videoReady) return;
  // Target the *middle* of the chapter's scroll window
  const t = ((idx + 0.4) / CHAPTER_COUNT) * scrollMax;
  smoothScrollTo(t, reducedMotion ? 0 : NAV_SCRUB_DURATION_MS);
}

function smoothScrollTo(toY, duration) {
  if (smoothScrollTween) cancelAnimationFrame(smoothScrollTween.raf);
  if (duration <= 0) {
    window.scrollTo(0, toY);
    targetTime = (toY / scrollMax) * videoDuration;
    smoothScrollTween = null;
    return;
  }
  const startY = window.scrollY;
  const delta = toY - startY;
  const t0 = performance.now();
  const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // easeInOutCubic
  const step = () => {
    const t = Math.min(1, (performance.now() - t0) / duration);
    const y = startY + delta * ease(t);
    window.scrollTo(0, y);
    targetTime = (y / scrollMax) * videoDuration;
    if (t < 1) {
      smoothScrollTween.raf = requestAnimationFrame(step);
    } else {
      smoothScrollTween = null;
    }
  };
  smoothScrollTween = { raf: requestAnimationFrame(step) };
  userInteracted = true;
  hintEl.classList.add('fade');
}

/* ============================================================
   Intro
   ============================================================ */
function startJourney() {
  intro.classList.add('hidden');
  // Try playing through quickly to warm decoder, then pause for scrub
  const warm = video.play();
  if (warm && warm.then) warm.then(() => { video.pause(); }).catch(() => { /* will scrub on first scroll */ });
}
introStart.addEventListener('click', startJourney);

// Auto-dismiss intro if user starts scrolling without clicking
let introDismissed = false;
window.addEventListener('scroll', () => {
  if (!introDismissed && window.scrollY > 30) {
    introDismissed = true;
    intro.classList.add('hidden');
  }
}, { passive: true });

/* ============================================================
   Cursor glow + card tilt
   ============================================================ */
let pointerFine = matchMedia('(pointer: fine)').matches;
if (pointerFine && !reducedMotion) {
  document.addEventListener('mousemove', (e) => {
    cursorGlow.style.left = e.clientX + 'px';
    cursorGlow.style.top = e.clientY + 'px';
    cursorGlow.style.opacity = '1';
  });
  document.addEventListener('mouseleave', () => { cursorGlow.style.opacity = '0'; });

  // Subtle tilt for glass cards in active frame
  overlayLayer.addEventListener('mousemove', (e) => {
    const cards = overlayLayer.querySelectorAll('.chapter-frame.visible .glass');
    cards.forEach((card) => {
      const r = card.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = (e.clientX - cx) / r.width;
      const dy = (e.clientY - cy) / r.height;
      const max = 4;
      card.style.transform = `perspective(1000px) rotateY(${(-dx * max).toFixed(2)}deg) rotateX(${(dy * max).toFixed(2)}deg) translateZ(0)`;
    });
  });
  overlayLayer.addEventListener('mouseleave', () => {
    overlayLayer.querySelectorAll('.glass').forEach(c => c.style.transform = '');
  });
}

/* ============================================================
   Keyboard nav
   ============================================================ */
window.addEventListener('keydown', (e) => {
  if (!videoReady) return;
  const p = videoDuration ? currentTime / videoDuration : 0;
  const idx = Math.min(CHAPTER_COUNT - 1, Math.max(0, Math.floor(p * CHAPTER_COUNT)));
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault(); smoothScrollToChapter(Math.min(CHAPTER_COUNT - 1, idx + 1));
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault(); smoothScrollToChapter(Math.max(0, idx - 1));
  } else if (e.key === 'Home') {
    e.preventDefault(); smoothScrollTo(0, 1000);
  } else if (e.key === 'End') {
    e.preventDefault(); smoothScrollTo(scrollMax, 1400);
  }
});

/* ============================================================
   Touch wheel — prevent the intro from blocking first scroll on mobile
   ============================================================ */
recomputeScrollMax();
</script>

</body>
</html>
